        cameraUp: [0, 0, 1], initialCameraPosition: cam.position, initialCameraLookAt: cam.lookAt,
        sharedMemoryForWorkers: false, gpuAcceleratedSort: false, sphericalHarmonicsDegree: 2,
        dynamicScene: false, freeIntermediateSplatData: true,
      });
      viewer.checkForFocalPointChange = () => {};  // built-in click focus is too strict (2px); ours runs instead
      const fmt = FORMAT[extOf(srcName.replace(/\.part\d+$/, ''))];
      await viewer.addSplatScene(url, { format: fmt, splatAlphaRemovalThreshold: 5, showLoadingUI: true, progressiveLoad: true, onProgress: (p) => { if (p != null) setProgress(p / 100); } });
      viewer.start(); setMode();
      const v = viewer, refresh = () => { if (viewer !== v) return; const n = v.getSplatMesh().getSplatCount(), busy = v.isLoadingOrUnloading && v.isLoadingOrUnloading(); if (!/^centre/.test(status.textContent)) status.textContent = `${label} · ${n.toLocaleString()} splats${busy ? ' · loading…' : ''}`; if (busy) setTimeout(refresh, 500); else setProgress(null); };
      refresh();
    }
  } catch (e) {
    status.textContent = `could not open ${label}: ${e.message || e}`; empty.style.display = ''; console.error(e);
  }
  setProgress(null);
}
function applyCamera(cam) {
  if (!cam || !viewer) return;
  viewer.camera.position.fromArray(cam.position); viewer.controls.target.fromArray(cam.lookAt); viewer.controls.update();
}
sel.onchange = () => {
  const v = sel.value; if (!v.startsWith('scene:')) return;
  const s = scenes[+v.slice(6)];
  const base = s.files ? s.files : [s.file];
  const u = new URL(location.href); u.searchParams.delete('url'); u.searchParams.set('scene', s.id || s.name); history.replaceState(null, '', u);
  open({ name: s.name, url: s.files ? undefined : s.file, urls: s.files ? base : undefined, kind: s.kind, camera: s.camera });
};
$('openbtn').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) { sel.value = ''; open({ name: f.name, file: f }); } };
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
window.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) { sel.value = ''; open({ name: f.name, file: f }); } });

setMode();
const q = new URLSearchParams(location.search);
if (q.get('url')) open({ url: q.get('url') });
else {
  const want = q.get('scene'); const i = scenes.findIndex(s => (s.id || s.name) === want);
  if (i >= 0) { sel.value = 'scene:' + i; sel.onchange(); }
  else if (scenes.length && !q.has('empty')) { sel.value = 'scene:0'; sel.onchange(); }
}
</script>
